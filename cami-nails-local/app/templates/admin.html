{% extends 'base.html' %}{% block content %}<div class="head"><div><h1>Conta administradora</h1><p>Gerencie o e-mail de acesso e sua senha.</p></div></div><section class="panel">{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="form">{{ csrf() }}<label>E-mail de acesso<input type="email" name="email" value="{{ user.email }}" required maxlength="254" autocomplete="username"></label><label>Senha atual<input type="password" name="senha_atual" required autocomplete="current-password"></label><label>Nova senha (deixe em branco para manter)<input type="password" name="nova_senha" minlength="12" maxlength="128" autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" name="confirmacao" maxlength="128" autocomplete="new-password"></label><button class="primary">Salvar dados de acesso</button><p class="sub">Ao salvar, todas as sessões serão encerradas. A senha nunca é exibida ou salva em texto aberto.</p></form></section>{% endblock %}
