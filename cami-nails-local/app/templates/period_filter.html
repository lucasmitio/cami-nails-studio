<form class="toolbar period-filter" method="get"><label>Período <select name="periodo" data-autosubmit>{% for value,label in [('semana','Semana'),('mes','Mês'),('ano','Ano')] %}<option value="{{ value }}" {{ 'selected' if mode==value }}>{{ label }}</option>{% endfor %}</select></label><label>Data de referência <input type="date" name="data" value="{{ anchor }}" data-autosubmit></label><button class="secondary">Aplicar filtro</button><span>{{ start.strftime('%d/%m/%Y') }} a {{ end.strftime('%d/%m/%Y') }}</span></form>
