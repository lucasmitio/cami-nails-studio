{% extends 'base.html' %}{% block content %}<div class="head"><h1>Novo lançamento</h1></div><section class="panel">{% if error %}<p class="notice error">{{ error }}</p>{% endif %}<form method="post" class="form">{{ csrf() }}<input type="hidden" name="chave" value="{{ v.chave }}"><label>Tipo<select name="tipo" required>{% for t in ['Receita','Despesa'] %}<option {{ 'selected' if v.get('tipo')==t }}>{{ t }}</option>{% endfor %}</select></label><label>Agendamento vinculado (somente receitas)<select name="agendamento_id"><option value="">Sem vínculo / lançamento avulso</option>{% for a in choices %}<option value="{{ a.id }}" {{ 'selected' if v.get('agendamento_id')|string==a.id|string }}>{{ a.nome }} · {{ a.inicio|brdate }} · saldo {{ a.saldo|money }}</option>{% endfor %}</select></label><label>Valor recebido ou pago (R$)<input name="valor" type="number" min="0.01" max="1000000" step="0.01" required value="{{ v.get('valor','') }}"></label><label>Data do pagamento<input name="data" type="date" required value="{{ v.get('data','') }}"></label><label>Descrição<input name="descricao" required maxlength="200" placeholder="Ex.: Recebimento de manutenção" value="{{ v.get('descricao','') }}"></label><label>Categoria<input name="categoria" list="categorias" required maxlength="80" value="{{ v.get('categoria','') }}"><datalist id="categorias"><option value="Serviços"><option value="Materiais"><option value="Aluguel"><option value="Energia"><option value="Divulgação"><option value="Outros"></datalist></label><label>Forma de pagamento<select name="forma">{% for method in methods %}<option {{ 'selected' if v.get('forma')==method }}>{{ method }}</option>{% endfor %}</select></label><button class="primary">Registrar pagamento</button><a href="{{ url_for('financeiro.index') }}">Voltar sem salvar</a></form></section>{% endblock %}
