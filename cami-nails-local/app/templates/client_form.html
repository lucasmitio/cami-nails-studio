{% extends 'base.html' %}{% block content %}<div class="head"><h1>{{ title }}</h1></div><section class="panel">{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form class="form" method="post">{{ csrf() }}<label>Nome completo<input name="nome" value="{{ v.get('nome','') }}" required minlength="2" maxlength="100"></label><label>WhatsApp com DDD<input name="telefone" type="tel" value="{{ v.get('telefone','')|phone }}" required maxlength="25"></label><label>Nascimento (opcional)<input name="nascimento" type="date" value="{{ v.get('nascimento','') }}"></label><label>Instagram (opcional)<input name="instagram" maxlength="100" value="{{ v.get('instagram','') }}"></label><label>Preferências e observações (opcional)<textarea name="observacoes" rows="4" maxlength="2000">{{ v.get('observacoes','') }}</textarea></label><h2>Endereço</h2><p>Campos opcionais.</p><div class="formrow"><label>CEP<input name="cep" maxlength="9" value="{{ v.get('cep','') }}"></label><label>Rua / avenida<input name="logradouro" maxlength="150" value="{{ v.get('logradouro','') }}"></label><label>Número<input name="numero" maxlength="150" value="{{ v.get('numero','') }}"></label><label>Complemento<input name="complemento" maxlength="150" value="{{ v.get('complemento','') }}"></label><label>Bairro<input name="bairro" maxlength="150" value="{{ v.get('bairro','') }}"></label><label>Cidade<input name="cidade" maxlength="150" value="{{ v.get('cidade','') }}"></label><label>UF<input name="uf" maxlength="2" value="{{ v.get('uf','') }}"></label></div><label class="check"><input type="checkbox" name="aceita_mensagens" value="1" {{ "checked" if v.get("aceita_mensagens") }}> Cliente autorizou receber lembretes pelo WhatsApp</label><button class="primary">Salvar cliente</button><a href="{{ url_for('clients') }}">Voltar sem salvar</a></form></section>{% endblock %}
