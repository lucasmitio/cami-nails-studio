{% extends 'base.html' %}{% block content %}<div class="head"><h1>{{ title }}</h1></div><section class="panel">{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form class="form" method="post">{{ csrf() }}<label>Nome<input name="nome" value="{{ v.get('nome','') }}" required maxlength="100"></label><label>Preço em reais<input name="preco" type="number" step="0.01" min="0" max="100000" value="{{ v.get('preco','') }}" required></label><label>Duração em minutos<input name="duracao" type="number" min="1" max="720" value="{{ v.get('duracao',60) }}" required></label><label>Intervalo de manutenção em dias (0 = sem sugestão)<input name="intervalo" type="number" min="0" max="365" value="{{ v.get('intervalo',21) }}" required></label><label>Descrição<textarea name="descricao" maxlength="1000">{{ v.get('descricao','') }}</textarea></label><button class="primary">Salvar serviço</button><a href="{{ url_for('services') }}">Voltar sem salvar</a></form></section>{% endblock %}
